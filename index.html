<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 智能星轨 · EasyInput Companion</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js Local Engine -->
  <script src="/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdf.worker.min.js';
    }
  </script>
  <!-- Google Fonts for Apple-Grade Sharp Typography (Inter & JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="h-full bg-[#F5F5F7] text-[#1D1D1F] font-sans transition-colors duration-200 antialiased overflow-hidden select-none">
  <!-- React Mount Point -->
  <div id="root" class="relative w-full h-full"></div>

  <!-- Vite entrypoint -->
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
